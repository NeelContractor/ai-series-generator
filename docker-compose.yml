name: ai-series-generator

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seriesforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seriesforge}
      POSTGRES_DB: ${POSTGRES_DB:-seriesforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-seriesforge} -d ${POSTGRES_DB:-seriesforge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-alias:
    image: cgr.dev/chainguard/minio-client:latest
    user: "0"
    depends_on:
      minio:
        condition: service_started
    command:
      [
        "--config-dir",
        "/mc",
        "alias",
        "set",
        "local",
        "http://minio:9000",
        "${MINIO_ROOT_USER:-minioadmin}",
        "${MINIO_ROOT_PASSWORD:-minioadmin}",
      ]
    volumes:
      - mc_config:/mc
    restart: on-failure

  minio-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    user: "0"
    depends_on:
      minio-alias:
        condition: service_completed_successfully
    command:
      [
        "--config-dir",
        "/mc",
        "mb",
        "--ignore-existing",
        "local/${S3_BUCKET:-seriesforge}",
      ]
    volumes:
      - mc_config:/mc
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-seriesforge}:${POSTGRES_PASSWORD:-seriesforge}@postgres:5432/${POSTGRES_DB:-seriesforge}
      MEDIA_DIR: /data/media
      MEDIA_URL_PREFIX: /media
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-seriesforge}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mc_config:
  media_data:
